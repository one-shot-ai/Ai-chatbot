<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aesthetic AI Chatbot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f5ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        },
                        neon: {
                            purple: '#a855f7',
                            cyan: '#06b6d4',
                            pink: '#ec4899'
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    animation: {
                        'pulse-glow': 'pulseGlow 3s infinite alternate',
                        'float': 'float 4s ease-in-out infinite',
                    },
                    keyframes: {
                        pulseGlow: {
                            '0%': { opacity: '0.4', transform: 'scale(1)' },
                            '100%': { opacity: '0.8', transform: 'scale(1.08)' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-6px)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .glass-panel {
            background: rgba(18, 24, 38, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .light .glass-panel {
            background: rgba(255, 255, 255, 0.82);
            border: 1px solid rgba(0, 0, 0, 0.08);
        }

        .glass-bubble-user {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            box-shadow: 0 4px 20px -2px rgba(99, 102, 241, 0.35);
        }

        .glass-bubble-bot {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .light .glass-bubble-bot {
            background: rgba(241, 245, 249, 0.9);
            border: 1px solid rgba(0, 0, 0, 0.06);
            color: #0f172a;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.3);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(156, 163, 175, 0.5);
        }

        .typing-dot {
            animation: typingAnimation 1.4s infinite ease-in-out fill-mode-both;
        }
        .typing-dot:nth-child(1) { animation-delay: 0s; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingAnimation {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1.1); opacity: 1; }
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen transition-colors duration-300 flex flex-col justify-between overflow-x-hidden light:bg-slate-100 light:text-slate-900 selection:bg-brand-500 selection:text-white">

    <div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
        <div class="absolute -top-32 -left-32 w-96 h-96 bg-neon-purple/20 rounded-full blur-3xl animate-pulse-glow"></div>
        <div class="absolute top-1/2 -right-32 w-96 h-96 bg-neon-cyan/20 rounded-full blur-3xl animate-pulse-glow" style="animation-delay: 1.5s;"></div>
        <div class="absolute -bottom-32 left-1/3 w-96 h-96 bg-brand-500/20 rounded-full blur-3xl animate-pulse-glow" style="animation-delay: 0.8s;"></div>
    </div>

    <header class="relative z-10 w-full max-w-5xl mx-auto px-4 pt-4 sm:pt-6">
        <div class="glass-panel rounded-2xl p-4 sm:px-6 flex items-center justify-between shadow-2xl">
            <div class="flex items-center space-x-3">
                <div class="relative">
                    <div class="w-10 h-10 sm:w-11 sm:h-11 rounded-xl bg-gradient-to-tr from-brand-600 via-neon-purple to-neon-cyan p-[2px] animate-float">
                        <div class="w-full h-full bg-slate-900 rounded-[10px] flex items-center justify-center light:bg-white">
                            <i data-lucide="sparkles" class="w-5 h-5 text-neon-purple"></i>
                        </div>
                    </div>
                    <span class="absolute bottom-0 right-0 w-3 h-3 bg-emerald-500 border-2 border-slate-900 rounded-full light:border-white"></span>
                </div>
                <div>
                    <h1 class="text-base sm:text-lg font-bold bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent light:from-slate-900 light:to-slate-700">
                        Nexus AI <span class="text-xs px-2 py-0.5 rounded-full bg-brand-500/20 text-brand-500 border border-brand-500/30 ml-1 font-semibold">PRO</span>
                    </h1>
                    <p class="text-xs text-slate-400 flex items-center gap-1.5 light:text-slate-500">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> Intelligent Assistant
                    </p>
                </div>
            </div>

            <!-- Controls -->
            <div class="flex items-center space-x-2 sm:space-x-3">
                <button id="clearBtn" title="Clear Chat" class="p-2.5 rounded-xl hover:bg-slate-800/60 text-slate-400 hover:text-white transition-all light:hover:bg-slate-200 light:text-slate-600">
                    <i data-lucide="trash-2" class="w-4 h-4 sm:w-5 sm:h-5"></i>
                </button>
                <button id="themeToggle" title="Toggle Mode" class="p-2.5 rounded-xl hover:bg-slate-800/60 text-slate-400 hover:text-white transition-all light:hover:bg-slate-200 light:text-slate-600">
                    <i data-lucide="moon" id="themeIcon" class="w-4 h-4 sm:w-5 sm:h-5"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="relative z-10 w-full max-w-5xl mx-auto px-4 my-4 flex-1 flex flex-col justify-between h-[calc(100vh-180px)]">
        <div class="glass-panel rounded-2xl flex-1 p-4 sm:p-6 flex flex-col overflow-hidden shadow-2xl relative">
            
            <!-- Chat Logs Scrollable Window -->
            <div id="chatContainer" class="flex-1 overflow-y-auto pr-2 space-y-5">
                
                <!-- Welcome Banner -->
                <div id="welcomeBanner" class="text-center py-8 px-4 my-auto">
                    <div class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-gradient-to-tr from-brand-500 to-neon-purple flex items-center justify-center shadow-lg shadow-brand-500/30 text-white">
                        <i data-lucide="bot" class="w-8 h-8"></i>
                    </div>
                    <h2 class="text-xl sm:text-2xl font-bold text-slate-100 light:text-slate-900 mb-2">How can I help you today?</h2>
                    <p class="text-xs sm:text-sm text-slate-400 light:text-slate-600 max-w-md mx-auto mb-6">
                        Ask questions, analyze images, brainstorm ideas, or generate high-quality content instantly.
                    </p>

                    <!-- Quick Prompt Chips -->
                    <div class="flex flex-wrap justify-center gap-2 max-w-lg mx-auto">
                        <button onclick="sendQuickPrompt('Analyze code snippet')" class="text-xs px-3.5 py-2 rounded-xl bg-slate-800/60 hover:bg-slate-700/80 border border-slate-700/50 text-slate-300 hover:text-white transition-all light:bg-slate-200 light:border-slate-300 light:text-slate-700 light:hover:bg-slate-300 flex items-center gap-1.5">
                            <i data-lucide="code" class="w-3.5 h-3.5 text-neon-cyan"></i> Analyze Code
                        </button>
                        <button onclick="sendQuickPrompt('Creative writing ideas')" class="text-xs px-3.5 py-2 rounded-xl bg-slate-800/60 hover:bg-slate-700/80 border border-slate-700/50 text-slate-300 hover:text-white transition-all light:bg-slate-200 light:border-slate-300 light:text-slate-700 light:hover:bg-slate-300 flex items-center gap-1.5">
                            <i data-lucide="pen-tool" class="w-3.5 h-3.5 text-neon-pink"></i> Creative Ideas
                        </button>
                        <button onclick="sendQuickPrompt('Explain Quantum Physics')" class="text-xs px-3.5 py-2 rounded-xl bg-slate-800/60 hover:bg-slate-700/80 border border-slate-700/50 text-slate-300 hover:text-white transition-all light:bg-slate-200 light:border-slate-300 light:text-slate-700 light:hover:bg-slate-300 flex items-center gap-1.5">
                            <i data-lucide="brain" class="w-3.5 h-3.5 text-neon-purple"></i> Physics Insights
                        </button>
                    </div>
                </div>

            </div>

            <div id="imagePreviewContainer" class="hidden relative pt-3 border-t border-slate-800 light:border-slate-200">
                <div class="relative inline-block">
                    <img id="imagePreview" src="" alt="Upload preview" class="w-20 h-20 object-cover rounded-xl border border-brand-500/50 shadow-md">
                    <button onclick="removeSelectedImage()" class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full p-1 hover:bg-red-600 transition">
                        <i data-lucide="x" class="w-3 h-3"></i>
                    </button>
                </div>
            </div>

            <div class="pt-3 mt-2 border-t border-slate-800/60 light:border-slate-200">
                <form id="chatForm" class="flex items-center gap-2">
                    
                    <!-- File Input Trigger -->
                    <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="handleImageSelect(event)">
                    <button type="button" onclick="document.getElementById('imageInput').click()" title="Attach Image" class="p-3 rounded-xl bg-slate-800/60 hover:bg-slate-700/80 text-slate-400 hover:text-neon-cyan transition-all border border-slate-700/50 light:bg-slate-200 light:border-slate-300 light:text-slate-600">
                        <i data-lucide="image" class="w-5 h-5"></i>
                    </button>

                    <!-- Text Area / Input -->
                    <div class="relative flex-1">
                        <input type="text" id="userInput" placeholder="Ask Nexus AI anything..." autocomplete="off" class="w-full bg-slate-900/80 border border-slate-700/60 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition light:bg-slate-100 light:border-slate-300 light:text-slate-900 light:placeholder-slate-400">
                    </div>

                    <!-- Send Button -->
                    <button type="submit" id="sendBtn" class="p-3 rounded-xl bg-gradient-to-r from-brand-600 to-neon-purple hover:opacity-90 text-white shadow-lg shadow-brand-500/30 transition-all transform active:scale-95">
                        <i data-lucide="send" class="w-5 h-5"></i>
                    </button>
                </form>
            </div>

        </div>
    </main>

    <div id="lightbox" class="fixed inset-0 bg-black/90 z-50 hidden flex items-center justify-center p-4 backdrop-blur-md">
        <button onclick="closeLightbox()" class="absolute top-5 right-5 text-white bg-slate-800/80 p-2 rounded-full hover:bg-slate-700">
            <i data-lucide="x" class="w-6 h-6"></i>
        </button>
        <img id="lightboxImg" class="max-w-full max-h-[90vh] rounded-2xl shadow-2xl border border-slate-700" src="" alt="Full view">
    </div>

    <footer class="relative z-10 w-full max-w-5xl mx-auto px-4 pb-4 text-center">
        <p class="text-xs text-slate-500 light:text-slate-600 font-medium tracking-wide">
            Crafted with <span class="text-red-500 animate-pulse">❤️</span> by <span class="text-slate-300 light:text-slate-800 font-bold bg-gradient-to-r from-brand-500 to-neon-purple bg-clip-text text-transparent">Hasibul Hasan</span>
        </p>
    </footer>

  <script>
    // ==============================
    // Nexus AI - Real Gemini Chat
    // ==============================

    let selectedImageBase64 = null;
    let isDarkMode = true;

    lucide.createIcons();

    // DOM Elements
    const chatContainer = document.getElementById('chatContainer');
    const welcomeBanner = document.getElementById('welcomeBanner');
    const chatForm = document.getElementById('chatForm');
    const userInput = document.getElementById('userInput');
    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    const clearBtn = document.getElementById('clearBtn');
    const imagePreviewContainer = document.getElementById('imagePreviewContainer');
    const imagePreview = document.getElementById('imagePreview');
    const sendBtn = document.getElementById('sendBtn');


    // ==============================
    // Theme Toggle
    // ==============================

    themeToggle.addEventListener('click', () => {

        isDarkMode = !isDarkMode;

        if (isDarkMode) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            themeIcon.setAttribute('data-lucide', 'moon');
        } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            themeIcon.setAttribute('data-lucide', 'sun');
        }

        lucide.createIcons();
    });


    // ==============================
    // Clear Chat
    // ==============================

    clearBtn.addEventListener('click', () => {

        chatContainer.innerHTML = '';

        chatContainer.appendChild(welcomeBanner);

        welcomeBanner.classList.remove('hidden');

        userInput.focus();
    });


    // ==============================
    // Quick Prompts
    // ==============================

    function sendQuickPrompt(promptText) {

        userInput.value = promptText;

        chatForm.dispatchEvent(
            new Event('submit', {
                bubbles: true,
                cancelable: true
            })
        );
    }


    // ==============================
    // Image Selection
    // ==============================

    function handleImageSelect(event) {

        const file = event.target.files[0];

        if (!file) return;

        const reader = new FileReader();

        reader.onload = function (e) {

            selectedImageBase64 = e.target.result;

            imagePreview.src = selectedImageBase64;

            imagePreviewContainer.classList.remove('hidden');

            lucide.createIcons();
        };

        reader.readAsDataURL(file);
    }


    function removeSelectedImage() {

        selectedImageBase64 = null;

        document.getElementById('imageInput').value = '';

        imagePreviewContainer.classList.add('hidden');

        imagePreview.src = '';
    }


    // ==============================
    // Submit Message
    // ==============================

    chatForm.addEventListener('submit', async (e) => {

        e.preventDefault();

        const text = userInput.value.trim();

        // For now, require text because our current
        // server.js accepts text messages.
        if (!text) return;


        // Hide welcome screen
        if (!welcomeBanner.classList.contains('hidden')) {
            welcomeBanner.classList.add('hidden');
        }


        // Show user's message
        renderUserMessage(text, selectedImageBase64);


        // Save image reference if needed
        const sentImage = selectedImageBase64;


        // Clear input
        userInput.value = '';

        removeSelectedImage();


        // Show typing
        showTypingIndicator();


        // Disable send button
        sendBtn.disabled = true;


        try {

            // =====================================
            // THIS CONNECTS TO YOUR SERVER.JS
            // =====================================

            const response = await fetch('/chat', {

                method: 'POST',

                headers: {
                    'Content-Type': 'application/json'
                },

                body: JSON.stringify({
                    message: text
                })

            });


            // Try to read server response
            const data = await response.json();


            removeTypingIndicator();


            // If server returned an error
            if (!response.ok) {

                addBotMessage(
                    data.reply || 'Something went wrong. Please try again.'
                );

            } else {

                // REAL GEMINI RESPONSE
                addBotMessage(
                    data.reply || 'I could not generate a response.'
                );

            }


        } catch (error) {

            console.error('Chat error:', error);

            removeTypingIndicator();


            addBotMessage(
                '⚠️ Unable to connect to the AI server. Please try again.'
            );

        }


        sendBtn.disabled = false;

        userInput.focus();

    });


    // ==============================
    // User Message
    // ==============================

    function renderUserMessage(text, imageSrc) {

        const time = new Date().toLocaleTimeString([], {
            hour: '2-digit',
            minute: '2-digit'
        });


        const messageWrapper = document.createElement('div');

        messageWrapper.className =
            'flex justify-end items-start gap-2.5 mb-4';


        let imageHTML = '';

        if (imageSrc) {

            imageHTML = `
                <img
                    src="${imageSrc}"
                    class="max-w-xs max-h-48 rounded-xl mb-2 cursor-pointer border border-white/20"
                >
            `;
        }


        messageWrapper.innerHTML = `

            <div class="flex flex-col items-end max-w-[80%] sm:max-w-[70%]">

                <div class="glass-bubble-user text-white p-3.5 rounded-2xl rounded-tr-none text-sm leading-relaxed shadow-lg">

                    ${imageHTML}

                    ${text ? `<p>${escapeHTML(text)}</p>` : ''}

                </div>

                <span class="text-[10px] text-slate-500 mt-1 mr-1">
                    ${time}
                </span>

            </div>


            <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-brand-500 to-neon-purple flex items-center justify-center text-xs text-white font-bold shrink-0">

                You

            </div>
        `;


        chatContainer.appendChild(messageWrapper);

        scrollToBottom();
    }


    // ==============================
    // Typing Indicator
    // ==============================

    function showTypingIndicator() {

        const typingWrapper = document.createElement('div');

        typingWrapper.id = 'typingIndicator';

        typingWrapper.className =
            'flex justify-start items-start gap-2.5 mb-4';


        typingWrapper.innerHTML = `

            <div class="w-8 h-8 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-neon-purple shrink-0">

                <i data-lucide="bot" class="w-4 h-4"></i>

            </div>


            <div class="glass-bubble-bot p-4 rounded-2xl rounded-tl-none flex items-center gap-1.5">

                <span class="w-2 h-2 bg-brand-500 rounded-full typing-dot"></span>

                <span class="w-2 h-2 bg-neon-purple rounded-full typing-dot"></span>

                <span class="w-2 h-2 bg-neon-cyan rounded-full typing-dot"></span>

            </div>
        `;


        chatContainer.appendChild(typingWrapper);

        lucide.createIcons();

        scrollToBottom();
    }


    function removeTypingIndicator() {

        const indicator =
            document.getElementById('typingIndicator');

        if (indicator) {
            indicator.remove();
        }
    }


    // ==============================
    // REAL AI BOT MESSAGE
    // ==============================

    function addBotMessage(responseText) {

        const time = new Date().toLocaleTimeString([], {
            hour: '2-digit',
            minute: '2-digit'
        });


        const messageWrapper = document.createElement('div');

        messageWrapper.className =
            'flex justify-start items-start gap-2.5 mb-4';


        messageWrapper.innerHTML = `

            <div class="w-8 h-8 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-neon-purple shrink-0 light:bg-slate-200 light:border-slate-300">

                <i data-lucide="bot" class="w-4 h-4"></i>

            </div>


            <div class="flex flex-col items-start max-w-[85%] sm:max-w-[75%]">

                <div class="glass-bubble-bot p-4 rounded-2xl rounded-tl-none text-sm leading-relaxed text-slate-200 light:text-slate-800 relative group">

                    <div class="whitespace-pre-wrap">
                        ${formatResponseText(responseText)}
                    </div>


                    <div class="flex items-center gap-3 mt-3 pt-2 border-t border-slate-700/40 text-xs text-slate-400 light:border-slate-300">

                        <button
                            class="copy-button hover:text-neon-cyan flex items-center gap-1 transition"
                        >
                            <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                            Copy
                        </button>


                        <button
                            class="speak-button hover:text-neon-purple flex items-center gap-1 transition"
                        >
                            <i data-lucide="volume-2" class="w-3.5 h-3.5"></i>
                            Speak
                        </button>

                    </div>

                </div>


                <span class="text-[10px] text-slate-500 mt-1 ml-1">
                    ${time}
                </span>

            </div>
        `;


        chatContainer.appendChild(messageWrapper);


        // Copy button
        const copyButton =
            messageWrapper.querySelector('.copy-button');

        copyButton.addEventListener('click', () => {

            navigator.clipboard.writeText(responseText);

            copyButton.innerHTML = `
                <i data-lucide="check" class="w-3.5 h-3.5 text-emerald-400"></i>
                Copied!
            `;

            lucide.createIcons();


            setTimeout(() => {

                copyButton.innerHTML = `
                    <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                    Copy
                `;

                lucide.createIcons();

            }, 2000);

        });


        // Speak button
        const speakButton =
            messageWrapper.querySelector('.speak-button');

        speakButton.addEventListener('click', () => {
            speakText(responseText);
        });


        lucide.createIcons();

        scrollToBottom();
    }


    // ==============================
    // Format AI Response
    // ==============================

    function formatResponseText(text) {

        // Escape HTML first
        let safeText = escapeHTML(text);


        // Bold
        safeText = safeText.replace(
            /\*\*(.*?)\*\*/g,
            '<strong>$1</strong>'
        );


        // Inline code
        safeText = safeText.replace(
            /`([^`]+)`/g,
            '<code class="bg-slate-800/80 text-neon-cyan px-1.5 py-0.5 rounded text-xs">$1</code>'
        );


        return safeText;
    }


    // ==============================
    // Escape HTML
    // ==============================

    function escapeHTML(str) {

        return String(str).replace(/[&<>'"]/g, tag => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            "'": '&#39;',
            '"': '&quot;'
        }[tag]));
    }


    // ==============================
    // Scroll
    // ==============================

    function scrollToBottom() {

        chatContainer.scrollTop =
            chatContainer.scrollHeight;
    }


    // ==============================
    // Text to Speech
    // ==============================

    function speakText(text) {

        if (!('speechSynthesis' in window)) return;

        window.speechSynthesis.cancel();

        const cleanText =
            text.replace(/```[\s\S]*?```/g, 'Code block omitted.');

        const utterance =
            new SpeechSynthesisUtterance(cleanText);

        utterance.pitch = 1;

        utterance.rate = 1;

        window.speechSynthesis.speak(utterance);
    }


    // ==============================
    // Lightbox
    // ==============================

    function openLightbox(src) {

        document.getElementById('lightboxImg').src = src;

        document
            .getElementById('lightbox')
            .classList.remove('hidden');
    }


    function closeLightbox() {

        document
            .getElementById('lightbox')
            .classList.add('hidden');
    }

</script>
</body>
</html>
